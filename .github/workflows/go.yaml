name: Go

on:
  push:
    branches: ["feat/dev"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.27'

      - name: Build
        run: go build -v ./... 
  tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.27'

      - name: Test
        run: go test -v ./...
  tests-race:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.27'
      

      - name: Test
        run: go test -race -v ./...
  lint:
    needs: [tests, tests_race]
    runs-on: ubuntu_latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.27'
      - name: Install golangci-lint
        run: go install github.com/golangci-lint/cmd/golangci-lint@latest
      - name: Run golangci-lint
        run: golangci-lint run --out-format=colored-line-number

  

